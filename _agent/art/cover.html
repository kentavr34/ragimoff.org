<!doctype html><html><head><meta charset="utf-8">
<!-- Обложки книг для сайта: рисунок (DashScope) + надписи шрифтом. Открыть: cover.html?b=klinik&l=az -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Правила обложки (канон, раздел 16): автор — вверху; название — во второй трети высоты (начинается сразу после первой трети), крупно, по центру;
   подзаголовок — под названием; рисунок — в нижней половине, не под названием; знак издателя — внизу; поля 7–8 % ширины; две гарнитуры. */
html,body{margin:0;background:#07090E}
.c{position:relative;width:800px;height:1200px;overflow:hidden;background:#080B14;color:#F2EDE3;font-family:"Cormorant Garamond",serif}
.art{position:absolute;left:0;top:250px;width:800px;height:1200px;background:center/cover no-repeat;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 300px);mask-image:linear-gradient(180deg,transparent 0,#000 300px)}
.c::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(8,11,20,.96) 0%,rgba(8,11,20,.82) 30%,rgba(8,11,20,0) 56%,rgba(8,11,20,0) 84%,rgba(8,11,20,.94) 97%)}
.c::after{content:"";position:absolute;inset:26px;border:1px solid rgba(201,169,97,.42);z-index:2}
.k,.a,.b,.tt{position:absolute;left:0;right:0;text-align:center;z-index:3}
.k{top:84px;font:600 19px/1 "Cormorant Garamond",serif;letter-spacing:.44em;color:#C9A961;padding-left:.44em;text-transform:uppercase}
.a{top:124px;font:500 34px/1 "Cormorant Garamond",serif;letter-spacing:.2em;padding-left:.2em;text-transform:uppercase}
.tt{top:392px;padding:0 60px;display:flex;flex-direction:column;align-items:center;gap:26px}
.t{font:500 80px/.98 "Cormorant Garamond",serif;letter-spacing:.035em;text-transform:uppercase}
.t.m{font-size:68px}.t.s2{font-size:58px}
.s{font:400 20px/1.35 "Inter",sans-serif;letter-spacing:.06em;color:#C9A961;max-width:560px}
.b{top:1116px;font:600 17px/1 "Inter",sans-serif;letter-spacing:.42em;padding-left:.42em}
.b i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#C9A961;margin-left:4px}
</style></head><body><div class="c" id="c"><div class="art" id="art"></div><div class="k" id="k"></div><div class="a" id="a"></div><div class="tt"><div class="t" id="t"></div><div class="s" id="s"></div></div><div class="b">RAGIMOFF<i></i></div></div>
<script>
/* [метка, автор, название, подпись] */
const D={
 klinik:{az:['Dərslik','Kənan Rəhimov','Klinik<br>psixiatriya','DSM-5 · XBT-11 · beynəlxalq protokollar'],
         ru:['Учебник','Кенан Рагимов','Клиническая<br>психиатрия','DSM-5 · МКБ-11 · международные протоколы'],
         en:['Textbook','Kenan Ragimov','Clinical<br>Psychiatry','DSM-5 · ICD-11 · international protocols']},
 phoenix:{az:['','Samirə Rəhimova','Feniks<br>erası','Şüurlu münasibətlərə aparan yol'],
          ru:['','Самира Рагимова','Эра<br>Феникса','Путь к осознанным отношениям'],
          en:['','Samira Ragimova','Phoenix<br>Era','The way to conscious relationships']},
 guilt:{az:['','Kənan Rəhimov','Günahkarlıq<br>virusu','Həyatı dağıdan hissdən necə azad olmaq'],
        ru:['','Кенан Рагимов','Вирус<br>вины','Как освободиться от чувства, разрушающего жизнь'],
        en:['','Kenan Ragimov','The Guilt<br>Virus','How to break free from the feeling that destroys a life']},
 pandemic:{az:['','Kənan Rəhimov','Şizofreniya','Cinnət pandemiyası'],
           ru:['','Кенан Рагимов','Шизофрения','Пандемия безумия'],
           en:['','Kenan Ragimov','Schizophrenia','A pandemic of madness']},
 therapy:{az:['Dərslik','Kənan Rəhimov','Ümumi<br>psixoterapiya',''],
          ru:['Учебник','Кенан Рагимов','Общая<br>психотерапия',''],
          en:['Textbook','Kenan Ragimov','General<br>Psychotherapy','']},
 freud:{az:['Azərbaycan dilində','','Ziqmund<br>Freyd','Əsərləri'],
        ru:['На азербайджанском языке','','Зигмунд<br>Фрейд','Собрание сочинений'],
        en:['In Azerbaijani','','Sigmund<br>Freud','Collected works']}};
const q=new URLSearchParams(location.search), b=q.get('b')||'klinik', l=q.get('l')||'az', d=D[b][l];
document.documentElement.lang=l;                                   /* az: i → İ, ə → Ə при переводе в прописные */
document.getElementById('art').style.backgroundImage='url(art-'+b+'.jpg)';
const TOP={freud:350,klinik:270,therapy:230}; if(TOP[b]) document.getElementById('art').style.top=TOP[b]+'px';
/* все буквы азербайджанского алфавита и кириллица должны быть из своей гарнитуры: расширенный набор грузим до снимка */
const ABC='ƏəİıŞşĞğÇçÖöÜüЖяЁё'+d.join(' ');
Promise.all(['600 19px','500 34px','500 80px'].map(f=>document.fonts.load(f+' "Cormorant Garamond"',ABC.toUpperCase()+ABC)).concat(['400 20px','600 17px'].map(f=>document.fonts.load(f+' "Inter"',ABC)))).then(()=>document.fonts.ready).then(()=>{document.body.dataset.ready='1';});
k.textContent=d[0]; a.textContent=d[1]; t.innerHTML=d[2]; s.textContent=d[3];
const longest=Math.max(...d[2].split('<br>').map(x=>x.length)); if(longest>10) t.classList.add('m'); if(longest>11) t.classList.add('s2');
</script></body></html>

<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Проба стека 11: three + postprocessing + rapier + matter</title>
<style>html,body{margin:0;background:#07090E;color:#F2EDE3;font:14px/1.5 system-ui}canvas{display:block;width:100vw;height:70vh}#log{padding:16px;white-space:pre-wrap}</style>
<script type="importmap">{"imports":{
 "three":"../../_tools/node_modules/three/build/three.module.js",
 "postprocessing":"../../_tools/node_modules/postprocessing/build/index.js",
 "rapier":"../../_tools/node_modules/@dimforge/rapier3d-compat/dist/rapier.mjs"}}</script>
<script src="../../_tools/node_modules/matter-js/build/matter.min.js"></script>
</head><body><canvas id="c"></canvas><div id="log">…</div>
<script type="module">
/* Проба: всё подключается как ES-модули без сборки. Результат пишется в window.__probe. */
const out = {}; const log = s => document.getElementById('log').textContent = s;
try {
  const THREE = await import('three'); out.three = THREE.REVISION;
  const PP = await import('postprocessing'); out.postprocessing = typeof PP.EffectComposer;
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false, powerPreference: 'high-performance' });
  renderer.setSize(innerWidth, innerHeight * .7, false);
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(45, innerWidth / (innerHeight * .7), .1, 100); cam.position.z = 6;
  const geo = new THREE.IcosahedronGeometry(1.4, 24);
  const mat = new THREE.MeshStandardMaterial({ color: 0xC9A961, metalness: .9, roughness: .25, emissive: 0x3a2a08 });
  const mesh = new THREE.Mesh(geo, mat); scene.add(mesh);
  scene.add(new THREE.PointLight(0xffffff, 60).translateX(3).translateY(3).translateZ(4), new THREE.AmbientLight(0x404050, 2));
  const composer = new PP.EffectComposer(renderer);
  composer.addPass(new PP.RenderPass(scene, cam));
  composer.addPass(new PP.EffectPass(cam, new PP.BloomEffect({ intensity: 1.4, luminanceThreshold: .35 }), new PP.VignetteEffect({ darkness: .6 }), new PP.NoiseEffect({ premultiply: true })));
  let frames = 0; const t0 = performance.now();
  await new Promise(done => { (function loop() { mesh.rotation.y += .01; composer.render(); if (++frames < 40) requestAnimationFrame(loop); else done(); })(); });
  out.frames = frames; out.msPerFrame = +((performance.now() - t0) / frames).toFixed(1);
  try { const RAPIER = (await import('rapier')).default; await RAPIER.init(); const w = new RAPIER.World({ x: 0, y: -9.81, z: 0 }); w.step(); out.rapier = RAPIER.version(); }
  catch (e) { out.rapier = 'ОШИБКА: ' + e.message; }
  out.matter = window.Matter ? Matter.version : 'нет';
  out.ok = true;
} catch (e) { out.ok = false; out.error = String(e && e.stack || e).slice(0, 400); }
window.__probe = out; log(JSON.stringify(out, null, 2));
</script></body></html>

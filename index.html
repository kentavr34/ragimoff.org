<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RAGIMOFF — Professional Psychology School</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0B0E11;
    --surface: #1E2026;
    --gold: #E6B44A;
    --text: #EAECEF;
    --muted: #8892aa;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { height: 100%; }
  body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Montserrat', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .container {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .logo {
    font-size: 2.5rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: var(--text);
    margin-bottom: 6px;
  }
  .logo em { font-style: normal; color: var(--gold); }
  .tagline {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 40px;
    font-weight: 300;
  }
  .lang-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 32px;
  }
  .lang-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 24px 16px;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
    color: var(--text);
  }
  .lang-btn:hover {
    border-color: var(--gold);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(230,180,74,0.15);
  }
  .lang-btn .code { font-size: 1.5rem; font-weight: 700; color: var(--gold); }
  .lang-btn .name { font-size: 0.75rem; color: var(--muted); font-weight: 400; }
  .footer { font-size: 0.7rem; color: var(--muted); opacity: 0.5; }
  .footer a { color: var(--gold); text-decoration: none; }
  @media (max-width: 400px) {
    .lang-grid { gap: 10px; }
    .lang-btn { padding: 18px 12px; }
    .logo { font-size: 2rem; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo">RAGIMOFF<em>.</em></div>
  <p class="tagline">Professional Psychology School</p>

  <nav class="lang-grid" aria-label="Language selection">
    <a class="lang-btn" href="az/index.html" data-lang="az">
      <span class="code">AZ</span>
      <span class="name">Azərbaycan</span>
    </a>
    <a class="lang-btn" href="ru/index.html" data-lang="ru">
      <span class="code">RU</span>
      <span class="name">Русский</span>
    </a>
    <a class="lang-btn" href="en/index.html" data-lang="en">
      <span class="code">EN</span>
      <span class="name">English</span>
    </a>
  </nav>

  <p class="footer"><a href="https://ragimoff.org">ragimoff.org</a></p>
</div>

<script>
(function() {
  // 1. Если есть сохранённый выбор — редирект
  var saved = localStorage.getItem('ragimoff_lang');
  if (saved && saved !== 'az') {
    window.location.replace(saved + '/index.html');
    return;
  }

  // 2. Автодетект языка системы (только при первом визите)
  if (!saved) {
    var lang = (navigator.language || navigator.userLanguage || 'az').toLowerCase();
    var target = 'az'; // default
    if (lang.indexOf('ru') === 0) target = 'ru';
    else if (lang.indexOf('en') === 0) target = 'en';

    localStorage.setItem('ragimoff_lang', target);
    if (target !== 'az') {
      window.location.replace(target + '/index.html');
      return;
    }
  }

  // 3. Сохранение выбора при клике
  var buttons = document.querySelectorAll('.lang-btn');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].addEventListener('click', function() {
      var lang = this.getAttribute('data-lang');
      localStorage.setItem('ragimoff_lang', lang);
    });
  }
})();
</script>
</body>
</html>

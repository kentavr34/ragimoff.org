<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGIMOFF</title>
  <meta name="description" content="Kenan Ragimov — klinik psixoloq, supervisor, IPAS Ambassador. RAGIMOFF.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Inter',system-ui,sans-serif;
      background:#0D0D12;
      color:#E8E4DD;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden
    }
    .card{
      max-width:520px;
      width:90%;
      padding:48px 32px;
      border:1px solid #2A2A35;
      border-radius:4px;
      text-align:center
    }
    .brand{
      font-family:'Cormorant Garamond',serif;
      font-size:36px;
      font-weight:500;
      letter-spacing:.02em;
      margin-bottom:8px
    }
    .brand em{color:#D4A843;font-style:italic}
    .sub{
      font-size:13px;
      color:#9A9AAA;
      letter-spacing:.12em;
      text-transform:uppercase;
      margin-bottom:32px
    }
    .links{
      display:flex;
      flex-direction:column;
      gap:8px
    }
    .links a{
      display:block;
      padding:14px 18px;
      background:transparent;
      color:#E8E4DD;
      border:1px solid #2A2A35;
      text-decoration:none;
      font-size:15px;
      font-weight:500;
      letter-spacing:.04em;
      transition:all .2s ease
    }
    .links a:hover{
      border-color:#D4A843;
      color:#D4A843;
      background:rgba(212,168,67,.05)
    }
    .links a em{
      color:#6B6B7B;
      font-style:normal;
      font-size:12px;
      margin-left:8px
    }
    .ip{font-size:11px;color:#4A4A55;margin-top:24px;letter-spacing:.08em}
  </style>
  <script>
    /* IP-based redirect: AZ for Azerbaijan, RU for Russia/CIS, fallback AZ */
    (function(){
      var lang='az';
      try{
        var tz=(Intl.DateTimeFormat().resolvedOptions().timeZone||'').toLowerCase();
        var loc=(navigator.language||navigator.userLanguage||'az').toLowerCase();
        var isRu=['ru','uk','be','kk','ky','uz','tg','az-cyrl','mo'].indexOf(loc.split('-')[0])>-1
          ||/europe\/moscow|europe\/kaliningrad|asia\/tashkent|asia\/almaty|asia\/baku/i.test(tz);
        var isAz=/^az/i.test(loc)||/asia\/baku/i.test(tz);
        if(isRu&&!isAz){lang='ru'}
      }catch(e){}
      /* Use Accept-Language as fallback for RU */
      try{
        var al=(navigator.languages||[navigator.language]).join(',');
        if(/^ru| uk| be| kk/i.test(al)&&!/^az/i.test(al)){lang='ru'}
      }catch(e){}
      try{localStorage.setItem('ragimoff-lang',lang)}catch(e){}
      setTimeout(function(){window.location.replace(lang+'/index.html')},120);
    })();
  </script>
</head>
<body>
  <main class="card">
    <div class="brand">RAGIM<em>OFF</em></div>
    <p class="sub">Kenan Ragimov · Klinik Psixologiya</p>
    <nav class="links" aria-label="Dil seçimi">
      <a href="az/index.html"><strong>Azərbaycan</strong> <em>AZ</em></a>
      <a href="ru/index.html">Русский <em>RU</em></a>
      <a href="en/index.html">English <em>EN</em></a>
      <a href="tr/index.html">Türkçe <em>TR</em></a>
    </nav>
    <p class="ip">By IP · your language is detected automatically</p>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ödəniş baş tutmadı — RAGIMOFF</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/books/books.css">
<style>
  body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
       background:#0f0f12;color:#e8e6e1;display:flex;min-height:100vh;
       align-items:center;justify-content:center;padding:24px}
  .pay{max-width:560px;text-align:center;background:#17171c;border:1px solid #2a2a33;
       border-radius:18px;padding:40px 28px}
  .pay__ico{font-size:56px;line-height:1;margin-bottom:16px}
  .pay__t{font-size:24px;font-weight:700;margin:0 0 12px}
  .pay__m{font-size:16px;line-height:1.6;color:#b9b6ae;margin:0 0 22px}
  .pay__b{display:inline-block;padding:13px 26px;border-radius:12px;
          background:#c9a227;color:#111;font-weight:700;text-decoration:none;margin:6px}
  .pay__b--ghost{background:transparent;color:#c9a227;border:1px solid #c9a227}
  .pay__note{font-size:13px;color:#8a8780;margin-top:20px;line-height:1.55}
</style>
</head>
<body>
  <main class="pay">
    <div class="pay__ico">&#10007;</div>
    <h1 class="pay__t">Ödəniş baş tutmadı</h1>
    <p class="pay__m">Ödəniş tamamlanmadı və ya ləğv edildi. Sifarişiniz yadda saxlanılıb — yenidən cəhd edə bilərsiniz.</p>
    <a class="pay__b" href="/books/">Yenidən cəhd et</a>
    <a class="pay__b pay__b--ghost" href="/">Ana səhifə</a>
    <p class="pay__note">Kartınızdan pul çıxıbsa və ya ödənişlə bağlı sualınız varsa, bizimlə əlaqə saxlayın — məsələni araşdıracağıq.</p>
  </main>
</body>
</html>

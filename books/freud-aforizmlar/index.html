<style>

/* приглушённые цвета текста осветлены (тёмно-серый #8B949E/#6E7681 на чёрном плохо читался).

   Стиль темы сохраняем: золото — акценты, светлый текст — основной; только контраст выше.

   Область — контент и боковое меню; шапку САЙТА не трогаем. */

.content-wrap, .sidebar nav{--text2:#C6CDD6; --text3:#AAB2BD}

/* ===== КНИЖНЫЙ ШАБЛОН — правим ТОЛЬКО контент. Шапку САЙТА не трогаем! ===== */

.content-wrap{max-width:44rem;margin:0 auto;padding:1.1rem 1.15rem 5.5rem}

.content-wrap p{margin:.72rem 0}

.content-wrap ul,.content-wrap ol{margin:.72rem 0;padding-left:1.3rem}

.content-wrap li{margin:.32rem 0}

.content-wrap h2{font-size:1.18rem;line-height:1.3;margin:1.8rem 0 .6rem;padding-bottom:.3rem;border-bottom:1px solid var(--border)}

.content-wrap h3{font-size:1.02rem;line-height:1.35;margin:1.15rem 0 .4rem;color:var(--text)}

.content-wrap table{font-size:.92rem}

/* методики — каждая отдельным блоком с чётким разделителем и воздухом */

.method-list dt{font-weight:700;color:var(--text);margin-top:1.4rem;padding-top:1rem;border-top:1px solid var(--border);line-height:1.35}

.method-list dt:first-child{margin-top:.4rem;padding-top:0;border-top:0}

.method-list dd{margin:.45rem 0 0;color:var(--text);line-height:1.6}

/* объединённые методики: нумерованный список «название — описание» */

.method-num{margin:1rem 0;padding-left:1.6rem}

.method-num>li{margin-top:1.1rem;padding-left:.25rem;line-height:1.6;color:var(--text)}

.method-num>li::marker{color:var(--gold);font-weight:700}

.method-num>li:first-child{margin-top:.4rem}

.method-num>li strong{color:var(--text);font-weight:700}



/* хлебная крошка — тихая строка вверху (вместо сиротской полосы-навигации) */

.crumb{font-size:.82rem;margin:.1rem 0 1.1rem}

.crumb a{color:var(--text2);text-decoration:none}

.crumb a:hover{color:var(--gold)}

/* якоря разделов не должны прятаться под фикс-шапкой сайта */

.content-wrap h2,.content-wrap h3{scroll-margin-top:calc(var(--hdr,64px) + 12px)}

/* внутристраничная навигация по разделам (как оглавление Википедии) */

.page-toc{display:flex;flex-wrap:wrap;gap:.4rem;margin:.2rem 0 1.4rem;padding:.7rem .2rem;border-bottom:1px solid var(--border)}

.page-toc a{font-size:.82rem;color:var(--text2);text-decoration:none;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:.25rem .6rem;transition:.15s;white-space:nowrap}

.page-toc a:hover{color:var(--bg);background:var(--gold);border-color:var(--gold)}

/* ШАПКА расстройства — выровненная «невидимая таблица» трёх классификаций */

table.dh{border-collapse:collapse;width:100%;margin:.2rem 0 1.5rem;border:0;border-bottom:2px solid var(--gold)}

table.dh td{border:0;padding:.3rem 0 .3rem .85rem;vertical-align:middle;text-align:left}

table.dh td:last-child{padding-right:0;width:100%}

table.dh .dh-meta{white-space:nowrap;vertical-align:middle;text-align:left;padding:.3rem .85rem .3rem 0;border-right:1px solid var(--border)}

table.dh .dh-lbl{display:block;font-family:var(--mono,monospace);font-size:.82rem;letter-spacing:.02em;text-transform:uppercase;color:var(--text3);font-weight:700;line-height:1.45}

table.dh .dh-code{display:block;font-family:var(--mono,monospace);font-weight:700;color:var(--gold);font-size:.82rem;letter-spacing:.02em;line-height:1.45;margin-top:0}

table.dh .dh-name{color:var(--text2);font-size:.94rem;line-height:1.3}

table.dh h1{font-size:1.42rem;line-height:1.2;margin:0;letter-spacing:-.01em;font-weight:800;color:var(--text)}

.dh-en{font-style:italic;color:var(--text2);font-size:.9rem;margin-top:.12rem;line-height:1.3;font-weight:400}

table.dh .dh-main .dh-lbl{color:var(--gold)}

table.dh .dh-main td{padding-bottom:.7rem}

table.dh tr:not(.dh-main) .dh-name{color:var(--text)}
table.dh tr:last-child td{padding-bottom:.8rem}



/* мобайл: комфортная типографика (НИКАКИХ правок шапки сайта) */

@media(max-width:720px){

  body{font-size:16px;line-height:1.6}

  .content-wrap{padding:.9rem 1rem 5.5rem}

  /* шапка расстройства — компактнее: меньше H1/имя, уже столбики ярлык/код */

  table.dh h1{font-size:1.22rem;letter-spacing:-.01em;line-height:1.28;word-break:normal;overflow-wrap:normal}

  table.dh .dh-name{font-size:.9rem;line-height:1.28}

  table.dh .dh-lbl,table.dh .dh-code{font-size:.78rem;line-height:1.4}

  table.dh .dh-meta{padding-right:.7rem}

  .content-wrap h2{font-size:1.2rem;margin-top:2rem;padding-bottom:.35rem}

  .content-wrap h3{font-size:1.04rem;margin-top:1.35rem}

  .content-wrap p{margin:.66rem 0}

  /* зона нажатия в навигации книги — не меньше 44 px (WCAG 2.5.8) */

  .nav-link,.nav-sub-link,.d-nav a,.page-toc a{min-height:44px;display:flex;align-items:center}

  .toc-ch>a{min-height:44px;display:grid;grid-template-columns:var(--tc-col) 1fr;gap:.6rem;align-items:center}

  .sb-close{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}

  .crumb a{min-height:44px;display:inline-flex;align-items:center}

  .tc-list>a,.toc-preview .toc-ch>a{min-height:44px;display:grid;grid-template-columns:var(--tc-col) 1fr;gap:.6rem;align-items:center}

  /* вкладки классификаций — все 3 в одну строку (были переносы XBT-10) */

  .cls-tabs{gap:.35rem;flex-wrap:nowrap}

  .cls-tabs .cls-tab{padding:.45rem .55rem;font-size:.8rem;letter-spacing:0;white-space:nowrap}

  /* оглавление — компактные заголовки групп и уже столбик кода */

  .toc-ch>a,.toc-ch .tc-head{font-size:.84rem;padding:.65rem .8rem;gap:.55rem}

  .toc-ch .tc-range{min-width:4rem;font-size:.8rem;white-space:nowrap}

  .toc-ch .tc-list a{font-size:.82rem;grid-template-columns:3.7rem 1fr;gap:.5rem;padding:.45rem .8rem}

  .toc-ch .tc-list .sc{white-space:nowrap}

}

/* ГОЛОВА ГЛАВЫ — одна строка: код + название, англ. ниже, подпись */

.chap-head{margin:.1rem 0 1.2rem;padding-bottom:.9rem;border-bottom:2px solid var(--gold)}

.chap-h1{font-size:1.5rem;line-height:1.22;margin:0;letter-spacing:-.01em;font-weight:800;color:var(--text);display:flex;flex-wrap:wrap;align-items:baseline;gap:.55rem}

.chap-range{font-family:var(--mono,monospace);color:var(--gold);font-size:1.02rem;font-weight:700;white-space:nowrap}

.chap-en{font-style:italic;color:var(--text2);font-size:.95rem;margin-top:.3rem;line-height:1.3}

.chap-sub{color:var(--text3);font-size:.88rem;margin:.6rem 0 0}

@media(max-width:720px){.chap-h1{font-size:1.28rem}.chap-range{font-size:.95rem}}

/* меню главы — выровнено в 2 колонки (код | название) */

.chapter-menu{display:flex;flex-direction:column;gap:.45rem;margin:1.3rem 0}

.ch-disorder{display:grid;grid-template-columns:3.8rem 1fr;align-items:baseline;gap:.7rem;padding:.7rem .9rem;border:1px solid var(--border);border-radius:8px;text-decoration:none;color:var(--text);background:var(--bg2);transition:.15s}

.ch-disorder:hover{background:var(--bg3);border-color:var(--gold)}

.ch-code{font-weight:700;color:var(--gold);font-family:var(--mono,monospace);font-variant-numeric:tabular-nums}

.ch-name{font-weight:600;color:var(--text)}

/* нижняя навигация — перелистывание (ТОЛЬКО внизу страницы) */

.d-nav{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:2.2rem 0 .5rem;padding:.7rem 0 0;border-top:1px solid var(--border)}

.d-nav a{color:var(--text);text-decoration:none;padding:.35rem .7rem;border-radius:6px;font-family:var(--mono,monospace);font-weight:700;font-size:.95rem;white-space:nowrap}

.d-nav a:hover{background:var(--bg3);color:var(--gold)}

.d-nav .up{color:var(--gold);font-family:var(--font);font-weight:600}

.d-nav .dn-name{color:var(--text2);font-weight:400;font-family:var(--font);font-size:.85rem}

@media(max-width:640px){ .d-nav .dn-name{display:none} .d-nav a{padding:.3rem .5rem} }

.h-chapter{font-size:1.55rem;text-align:center;margin:1rem 0 .3rem;color:var(--text)}

.h-chapter .icd{display:block;color:var(--text2);font-size:.95rem;font-weight:600;letter-spacing:.05em;font-family:var(--mono,monospace)}

.toc-preview{display:flex;flex-direction:column;gap:1.2rem;margin:1.5rem 0}

.toc-ch{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bg2)}

/* ЕДИНЫЙ СТАНДАРТ заголовка группы (глава/класс/блок) — одинаково во всех классификациях */

.toc-ch{--tc-col:5.4rem}.cls-panel[data-cls="icd"] .toc-ch{--tc-col:7rem}.cls-panel[data-cls="dsm"] .toc-ch{--tc-col:10.1rem}.cls-panel[data-cls="icd10"] .toc-ch{--tc-col:6.8rem}.toc-ch>a,.toc-ch .tc-head{display:grid;grid-template-columns:var(--tc-col) 1fr;align-items:baseline;gap:.6rem;padding:.8rem 1rem;text-decoration:none;color:var(--text);font-weight:700;font-size:.95rem;letter-spacing:.01em;background:var(--bg3)}

.toc-ch>a:hover{color:var(--gold)}

.toc-ch .tc-range{color:var(--gold);font-family:var(--mono,monospace);min-width:0;white-space:normal;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}

.toc-ch .tc-list{display:flex;flex-direction:column}

/* две выровненные колонки (невидимая таблица): код | название по одной вертикали */

.toc-ch .tc-list a{display:grid;grid-template-columns:4.2rem 1fr;gap:.6rem;align-items:baseline;padding:.5rem 1rem;text-decoration:none;color:var(--text2);font-size:.9rem;font-weight:600;border-top:1px solid var(--border)}

.toc-ch .tc-list a:hover{background:var(--bg3);color:var(--text)}.toc-ch>a>span:last-child,.toc-ch .tc-head>span:last-child,.toc-ch .tc-list a>span:last-child{overflow-wrap:anywhere;min-width:0}

.toc-ch .tc-list .sc{color:var(--gold);font-family:var(--mono,monospace);font-weight:700;font-variant-numeric:tabular-nums}

.toc-ch .tc-empty{padding:.5rem 1rem;color:var(--text3);font-size:.82rem;font-style:italic;border-top:1px solid var(--border)}

/* переключатель классификаций: вкладки XBT-11 / DSM-5-TR / XBT-10 */

[hidden]{display:none !important}

.cls-tabs{display:flex;gap:.5rem;justify-content:center;margin:1rem 0 .4rem;flex-wrap:wrap}

.cls-tab{background:var(--bg2);border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:.5rem 1.1rem;font-weight:700;font-size:.92rem;cursor:pointer;font-family:var(--mono,monospace);letter-spacing:.02em;transition:.15s}

.cls-tab:hover{color:var(--text);border-color:var(--gold)}

.cls-tab.is-active{background:var(--gold);color:var(--bg);border-color:var(--gold)}

.toc-meta{text-align:center;color:var(--text2);margin:.2rem 0 1rem;font-size:.9rem}

.tc-head{display:flex;align-items:baseline;gap:.7rem;padding:.85rem 1rem;color:var(--text);font-weight:700;background:var(--bg3)}

.tc-head .tc-range{color:var(--gold);font-family:var(--mono,monospace);min-width:0;white-space:normal;overflow-wrap:anywhere}

/* ЕДИНАЯ ТИПОГРАФИКА бокового меню (и раскрывающегося overlay) + выравнивание в 2 колонки.

   Действует и на живых страницах книг (head шаблона вставляется в каждую страницу). */

.sidebar nav .cls-tabs-side{display:flex;gap:.3rem;padding:.15rem 0 .7rem;margin-bottom:.4rem;border-bottom:1px solid var(--border)}

.sidebar nav .cls-tabs-side .cls-tab{flex:1;padding:.42rem .2rem;font-size:.72rem;text-align:center;margin:0}

/* сайдбар сведён к концепту оглавления: код — чистое золото (без пилюли), название — светлое */

.sidebar nav .nav-link{font-size:.92rem;letter-spacing:0;color:var(--text)}

.sidebar nav .nav-code{font-family:var(--mono,monospace);font-size:.78rem;font-variant-numeric:tabular-nums;background:none !important;padding:0 !important;border:0 !important;border-radius:0 !important;color:var(--gold)}

.sidebar nav .nav-link.is-bolme{display:grid;grid-template-columns:4.9rem 1fr;gap:.4rem;align-items:baseline;cursor:default;color:var(--text);font-weight:700}

.sidebar nav .nav-sub-link{display:grid;grid-template-columns:2.5rem 1fr;gap:.5rem;align-items:baseline;font-size:11px;line-height:1.4;color:var(--text);text-transform:none}

.sidebar nav .sub-code{color:var(--gold);font-family:var(--mono,monospace);font-size:10px;font-weight:400;letter-spacing:normal;font-variant-numeric:tabular-nums;min-width:0;background:none !important;padding:0 !important}

.sidebar nav .sub-name{color:var(--text);text-transform:none;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}

/* Оглавление сайдбара: шрифт и кегль как у кнопки «← Kitablar» (Montserrat 11px/400, letter-spacing:normal). Разделитель столбцов сдвинут влево на 5 мм: 3.7rem -> 2.5rem (59,19 px -> 40 px, -19,19 px = -5,08 мм). Освободившиеся ~19 px ушли в колонку названий (было 167,81 px при сайдбаре 280 px). Длинные названия — 2 строки с многоточием вместо 3-4 строк. */

.sidebar nav .nav-empty .sub-name{color:var(--text3);font-style:italic}

.sidebar nav .nav-empty{cursor:default}

/* вводные ссылки сайдбара — светлые, чуть акцентные */

.sidebar nav .nav-front{color:var(--text);font-weight:600}

.sidebar nav .nav-front:hover{color:var(--gold)}

/* ===== ГЛАВНАЯ (Ana səhifə) — титул + карточки-переходы ===== */

.home-hero{text-align:center;margin:1.5rem 0 1.8rem}

.home-title{font-size:2rem;line-height:1.1;letter-spacing:-.01em;color:var(--text);margin:0 0 .5rem;font-weight:800}

.home-sub{color:var(--text2);font-size:1rem;margin:0;line-height:1.4}

.home-cards{display:flex;flex-direction:column;gap:.7rem;margin:0 auto 2rem;max-width:40rem}

.home-card{display:flex;flex-direction:column;gap:.2rem;padding:1rem 1.15rem;border:1px solid var(--border);border-radius:10px;background:var(--bg2);text-decoration:none;transition:.15s}

.home-card:hover{background:var(--bg3);border-color:var(--gold)}

.home-card b{color:var(--gold);font-size:1.05rem;font-weight:700}

.home-card span{color:var(--text2);font-size:.9rem;line-height:1.35}

.home-card-main{border-color:var(--gold)}

/* мобайл: убрать лишнюю пустоту вокруг титула (site style.css даёт .home-hero padding 20/40 —

   перебиваем; блок до классификации поднимается выше, страница компактнее ~ на треть) */

@media(max-width:720px){.home-hero{margin:.4rem 0 .8rem;padding:8px 0 22px}.home-title{font-size:1.5rem}.home-sub{font-size:.92rem}}

/* ===== ВВОДНЫЕ страницы (Müqəddimə, Kitab haqqında, Terminoloji lüğət) ===== */

.front-page{max-width:44rem;margin:0 auto}

.front-page h1{font-size:1.5rem;line-height:1.2;color:var(--text);margin:.3rem 0 1rem;font-weight:800}

.front-page h2{font-size:1.18rem;line-height:1.3;margin:1.7rem 0 .6rem;padding-bottom:.3rem;border-bottom:1px solid var(--border);color:var(--text)}

.front-page h3{font-size:1.02rem;margin:1.1rem 0 .4rem;color:var(--text)}

.front-page p,.front-page li{color:var(--text);line-height:1.6}

.front-page table{font-size:.92rem;color:var(--text)}

@media(max-width:720px){.front-page h1{font-size:1.28rem}.front-page h2{font-size:1.08rem}}

</style>

<script>

function setCls(k){

  document.querySelectorAll('.cls-tab').forEach(function(t){t.classList.toggle('is-active',t.getAttribute('data-cls')===k);});

  document.querySelectorAll('.cls-panel,.cls-tree').forEach(function(p){p.hidden=(p.getAttribute('data-cls')!==k);});

}

</script>

<p>16 mart 1939.</p>
<p>Əziz, hörmətli cənab professor!</p>
<p>Mən indicə qayıtmışam və yalnız əvvəlcə bir dağ məktubun öhdəsindən gəlməliyəm. Amma sizi görmək üçün artıq dəhşətli dərəcədə səbirsizlənirəm və gələn günlərdə təvazökarlıqla özümü bildirəcəyəm.</p>
<p>Ən dərin salamlarla</p>
<p>pərəstişlə</p>
<p>Stefan Tsveyq</p>

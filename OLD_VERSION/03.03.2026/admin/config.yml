backend:
  name: github
  repo: kentavr34/ragimoff.org
  branch: main
  
media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: 'az'

collections:

  # ── BLOG ──────────────────────────────────────────────
  - name: "blog"
    label: "Blog Məqalələri"
    label_singular: "Məqalə"
    folder: "blog-posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "blog-{{slug}}.html"
    fields:
      - { label: "Başlıq", name: "title", widget: "string" }
      - { label: "Kateqoriya", name: "category", widget: "select",
          options: ["Klinik Psixologiya", "Ailə Terapiyası", "Enurez", "Panik Ataklar", "Depressiya", "Sosial Fobiya", "Özünüinkişaf"] }
      - { label: "Qısa təsvir (excerpt)", name: "excerpt", widget: "text" }
      - { label: "Oxuma müddəti", name: "readtime", widget: "string", default: "5 dəq" }
      - { label: "Emoji / ikon", name: "emoji", widget: "string", default: "🧠" }
      - { label: "Yayımlanma tarixi", name: "date", widget: "datetime" }
      - { label: "Məzmun (HTML)", name: "body", widget: "markdown" }

  # ── REVIEWS ───────────────────────────────────────────
  - name: "reviews"
    label: "Rəylər"
    label_singular: "Rəy"
    folder: "reviews"
    create: true
    slug: "{{year}}-{{slug}}"
    fields:
      - { label: "Ad", name: "name", widget: "string" }
      - { label: "Şəhər", name: "city", widget: "string", default: "Bakı" }
      - { label: "Xidmət", name: "service", widget: "select",
          options: ["Fərdi psixoterapiya", "Ailə terapiyası", "Enurez müalicəsi", "Praktikum", "Klinik Psixologiya Diplomu"] }
      - { label: "Qiymət (ulduz)", name: "stars", widget: "number", min: 1, max: 5, default: 5 }
      - { label: "Rəy mətni", name: "body", widget: "text" }
      - { label: "Tarix", name: "date", widget: "datetime" }
      - { label: "Saytda göstərilsin?", name: "published", widget: "boolean", default: true }

  # ── PRICES ────────────────────────────────────────────
  - name: "settings"
    label: "Sayt Ayarları"
    files:
      - name: "prices"
        label: "Qiymətlər"
        file: "data/prices.json"
        fields:
          - { label: "Canlı sessiya (AZN)", name: "canli_sessiya", widget: "number", default: 200 }
          - { label: "Canlı aylıq paket (AZN)", name: "canli_paket", widget: "number", default: 1000 }
          - { label: "Online sessiya (AZN)", name: "online_sessiya", widget: "number", default: 100 }
          - { label: "Online aylıq paket (AZN)", name: "online_paket", widget: "number", default: 500 }
          - { label: "Enurez ilk görüş (AZN)", name: "enurez_gorus", widget: "number", default: 50 }
          - { label: "Enurez kurs (AZN)", name: "enurez_kurs", widget: "number", default: 300 }
          - { label: "Praktikum (AZN)", name: "praktikum", widget: "number", default: 3000 }
          - { label: "Diplom (AZN)", name: "diplom", widget: "number", default: 6000 }

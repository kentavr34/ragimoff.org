<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Проверка библиотек</title>
<style>
  body { margin:0; background:#07090E; color:#E3DDD1; font:15px/1.6 system-ui, sans-serif; }
  .row { padding:20px 24px; border-bottom:1px solid rgba(242,237,227,.12); }
  h1 { font-size:22px; margin:0 0 6px; color:#F2EDE3; }
  .ok { color:#7FD18A; font-weight:600; } .bad { color:#FF8A8A; font-weight:600; }
  canvas { display:block; border:1px solid rgba(242,237,227,.12); border-radius:10px; }
  #three { width:420px; height:240px; }
  #matter { width:420px; height:200px; }
</style>
</head>
<body>
<div class="row">
  <h1>Проверка библиотек концепта 69</h1>
  <p id="status">проверяю…</p>
</div>

<div class="row">
  <h1>Three.js — 3D</h1>
  <p>Куб вращается. Проверка WebGL и модульной загрузки.</p>
  <canvas id="three"></canvas>
</div>

<div class="row">
  <h1>matter.js — 2D-физика</h1>
  <p>Частицы падают и сталкиваются. Проверка движка твёрдых тел.</p>
  <canvas id="matter"></canvas>
</div>

<script src="../vendor/matter.min.js"></script>
<script type="importmap">
{ "imports": { "three": "../vendor/three.module.js" } }
</script>

<script type="module">
const st = document.getElementById('status');
const report = [];

// ── THREE ──────────────────────────────────────────────────────────
let THREE;
try {
  THREE = await import('three');
  report.push('three: ' + (THREE.REVISION ? 'v' + THREE.REVISION + ' загружен' : 'загружен'));

  const cv = document.getElementById('three');
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
  renderer.setSize(420, 240, false);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(55, 420/240, 0.1, 100);
  cam.position.set(0, 0, 3.2);

  const geo = new THREE.IcosahedronGeometry(0.9, 1);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xC9A961, metalness: 0.85, roughness: 0.25, flatShading: true
  });
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);

  scene.add(new THREE.AmbientLight(0xffffff, 0.35));
  const key = new THREE.DirectionalLight(0xE2CC94, 2.2); key.position.set(2, 3, 4); scene.add(key);
  const rim = new THREE.DirectionalLight(0x6EA8FF, 1.1); rim.position.set(-3, -1, -2); scene.add(rim);

  renderer.setAnimationLoop(t => {
    mesh.rotation.y = t / 2400;
    mesh.rotation.x = t / 3600;
    renderer.render(scene, cam);
  });
  report.push('three: WebGL-рендер запущен');
} catch (e) {
  report.push('three: ОШИБКА — ' + e.message);
}

// ── MATTER ─────────────────────────────────────────────────────────
try {
  const M = window.Matter;
  if (!M) throw new Error('Matter не найден в window');
  const Engine = M.Engine, Render = M.Render, Runner = M.Runner, Bodies = M.Bodies,
        Composite = M.Composite, Mouse = M.Mouse, MouseConstraint = M.MouseConstraint;
  report.push('matter: v' + (M.version || '?') + ' загружен (UMD)');

  const eng = Engine.create();
  const rnd = Render.create({
    element: document.getElementById('matter'),
    engine: eng,
    options: { width: 420, height: 200, wireframes: false, background: 'transparent',
               pixelRatio: Math.min(devicePixelRatio, 2) }
  });
  const world = eng.world;
  const walls = [
    Bodies.rectangle(210, 205, 440, 12, { isStatic: true, render:{fillStyle:'#1a1f2b'} }),
    Bodies.rectangle(-6, 100, 12, 220, { isStatic: true, render:{fillStyle:'#1a1f2b'} }),
    Bodies.rectangle(426, 100, 12, 220, { isStatic: true, render:{fillStyle:'#1a1f2b'} })
  ];
  Composite.add(world, walls);
  const colors = ['#C9A961','#E2CC94','#8A6A22','#A8A296'];
  for (let i = 0; i < 14; i++) {
    Composite.add(world, Bodies.circle(80 + i * 22, 20 + (i % 5) * 26, 9 + (i % 4) * 3, {
      restitution: 0.55, render: { fillStyle: colors[i % colors.length] }
    }));
  }
  Composite.add(world, MouseConstraint.create(eng, { stiffness: 0.12 }));
  Render.run(rnd); Runner.run(Runner.create(), eng);
  report.push('matter: 14 тел + мышь, физика запущена');
} catch (e) {
  report.push('matter: ОШИБКА — ' + e.message);
}

st.innerHTML = report.map(r => (r.includes('ОШИБКА') ? '<span class="bad">✗ ' : '<span class="ok">✓ ') + r + '</span>').join('<br>');
window.__report = report;
</script>
</body>
</html>

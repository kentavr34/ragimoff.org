<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Сеть интеллекта — проверка</title>
<style>
  html,body{margin:0;height:100%;background:#07090E;overflow:hidden;
    font:16px/1.6 system-ui,sans-serif}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  #txt{position:fixed;left:6vw;bottom:16vh;z-index:2;pointer-events:none}
  h1{font:500 clamp(28px,3.3vw,47.5px)/1.24 Oswald,sans-serif;letter-spacing:.06em;
     text-transform:uppercase;color:#F2EDE3;margin:0;max-width:20ch}
  .hand{font-family:Georgia,serif;font-size:clamp(44px,4.6vw,72px);color:#E2CC94;
        line-height:1.05;margin-bottom:14px}
  #st{position:fixed;left:12px;top:12px;z-index:3;font:12px/1.7 monospace;color:#7FD18A;
      background:rgba(7,9,14,.7);padding:10px 14px;border-radius:8px}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="st">загрузка…</div>
<div id="txt">
  <div class="hand">Doctor Ragimoff</div>
  <h1>Школа психологии</h1>
</div>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script>
<script type="module">
import { initHeroNet } from '../design/components/hero-net.js';
let THREE;
try {
  THREE = await import('three');
} catch (e) {
  document.getElementById('st').textContent = 'ОШИБКА three: ' + e.message;
  throw e;
}
const net = initHeroNet(document.getElementById('cv'), { THREE });
if (!net) {
  document.getElementById('st').textContent = 'НЕ ИНИЦИАЛИЗИРОВАЛОСЬ';
} else {
  const c = net.counts;
  document.getElementById('st').innerHTML =
    '✅ сеть работает<br>узлов: ' + c.nodes + '<br>связей: ' + c.links +
    '<br>импульсов: ' + c.pulses + '<br>пыли: ' + c.dust;
  // прокрутка управляет сборкой
  window.addEventListener('scroll', () => {
    const h = document.body.scrollHeight - innerHeight;
    net.setProgress(h > 0 ? scrollY / h : 0);
  });
  window.__net = net;
}
</script>
</body>
</html>

<!-- Kitabın Sifarişi Modal -->
<div id="kitab-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#1a1d27;border:1px solid #2e3245;border-radius:12px;padding:36px 32px 28px;width:100%;max-width:400px;margin:20px;position:relative;box-shadow:0 18px 20px rgba(0,0,0,.62);">
    <button onclick="closeKitabModal()" style="position:absolute;top:14px;right:16px;background:none;border:none;color:#8892aa;font-size:18px;cursor:pointer;padding:4px 8px;line-height:1;">&#10005;</button>
    <div style="width:44px;height:44px;border-radius:8px;background:#E6B44A;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:14px;font-weight:700;color:#0f1117;margin-bottom:16px;">{{km_logo}}</div>
    <h2 style="font-size:20px;font-weight:700;color:#f0f2f8;margin:0 0 10px;font-family:monospace;">{{km_title}}</h2>
    <p style="font-size:13px;color:#c2c8d8;line-height:1.65;margin:0 0 22px;border-left:2px solid #c49b2f;padding-left:12px;">{{km_desc}}</p>
    
    
</div>


<script src="/../books/order-form.js" defer></script>
